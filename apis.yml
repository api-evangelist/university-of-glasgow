  - aid: university-of-glasgow:enlighten-rest
    name: Enlighten EPrints REST API
    x-operator: institution
    x-operator-evidence: >-
      Served from the same three institution-owned Enlighten hosts as the OAI-PMH endpoints
      (eprints, theses and researchdata under gla.ac.uk, all on 130.209.34.x). Records are returned
      in the EPrints 2.0 data namespace with Glasgow identifiers such as
      https://eprints.gla.ac.uk/id/eprint/1. No vendor identity appears in any response.
    description: >-
      An anonymous read interface over the Enlighten repositories that the University of Glasgow does
      not document or advertise anywhere: a dataset index at /rest/, an object index per dataset, a
      full EPrints 2.0 XML record at /rest/eprint/{id}.xml, a field index per record, and a plain
      text view of any single field. The subject taxonomy is public; the user dataset lists
      identifiers only and each user record returns 401. There is no published OpenAPI — the
      description carried here was derived by API Evangelist from live probes on 2026-08-30 and is
      marked as such.
    humanURL: https://eprints.gla.ac.uk/information.html
    baseURL: https://eprints.gla.ac.uk/rest
    tags: [ Repository, EPrints, Research Outputs, Metadata, Open Access ]
