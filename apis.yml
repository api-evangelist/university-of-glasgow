aid: university-of-glasgow
name: University of Glasgow
x-type: university
x-category: Public Research University
description: >-
  The University of Glasgow is a public research university in Glasgow, Scotland, founded in 1451 and
  a member of the Russell Group. Its programmable footprint is entirely its own — no part of it was
  found to be a vendor's contract running under the university's name — but it is small, unadvertised
  and library-shaped rather than product-shaped. What the institution actually operates and runs
  itself, verified live on 2026-08-30, is the Enlighten repository estate on its own EPrints
  deployment: three OAI-PMH 2.0 endpoints (Publications, Research Data and Theses, the last of which
  was not previously catalogued) and an anonymous read REST interface over the same repositories that
  the university does not describe anywhere. Alongside them it operates a Shibboleth SAML 2.0 identity
  provider scoped gla.ac.uk and registered in the UK Access Management Federation, which by volume and
  maintenance is the institution's largest machine-readable artifact and is a login federation rather
  than a data API. It mints its own DataCite DOIs under prefix 10.5525 and is Crossref member 21131.
  Two further surfaces are live on Glasgow hosts but run a third party's contract — the self-hosted
  Moodle VLE's LTI 1.3 platform endpoints and the library's Innovative Interfaces Sierra API, both
  credentialed. Its discovery layer and its research guides are vendor tenancies on OCLC WorldCat and
  Springshare LibGuides, recorded here as tenant relationships and deliberately not credited to the
  university. There is no central developer portal, no API key issuance, no changelog, no status page
  and no developer support channel anywhere on gla.ac.uk.
type: Index
x-coverage:
  state: covered
  reason: covered
  detail: >-
    Six institution-operated surfaces and one identity federation were found, probed and verified live
    on 2026-08-30, and two vendor-platform tenancies were identified and labelled rather than credited.
    The profile carries no misattribution to correct: nothing in this repository was ever a vendor's
    contract, so unlike most of the university cohort there was no Figshare, Pure, Ex Libris or
    Dataverse spec to remove. Three findings are new to this run — the Enlighten Theses OAI-PMH
    endpoint, the Enlighten EPrints REST interface, and the Shibboleth identity provider with its UK
    federation registration. The profile remains thin in developer-experience terms — no portal, no
    changelog, no status page, no support channel, no scopes, no versioning policy and no
    machine-readable error documents — and that thinness is a measurement of the institution rather
    than a gap in coverage. Two claims were checked and did not survive: www.gla.ac.uk/llms.txt is a
    301 redirect to a law postgraduate page rather than an agent manifest, and no
    .well-known/security.txt exists.
