  - aid: university-of-glasgow:moodle-lti
    name: Moodle VLE — LTI 1.3 Platform and Web Services
    x-operator: institution
    x-vendor: moodle
    x-operator-evidence: >-
      moodle.gla.ac.uk is 130.209.14.69, the university's own address space — a self-hosted Moodle,
      not a moodlecloud or vendor-hosted tenancy, so the host rule reads institution. The API
      contract, the LTI implementation and the exception envelope are Moodle's product and are named
      as such here rather than credited to Glasgow's engineering. Moodle's generic specification is
      deliberately NOT saved under this institution.
    description: >-
      The University of Glasgow's virtual learning environment, self-hosted on Moodle, exposes a live
      LTI 1.3 Advantage platform surface — a public JWKS at /mod/lti/certs.php carrying one RS256
      signing key, an OIDC authorisation endpoint and a token endpoint — plus the Moodle Web Services
      REST endpoint. Both are credentialed: access is by tool registration or token issued by the
      institution, with no public self-service. This is the university's only confirmed LTI
      conformance and one of only two surfaces here where the institution runs the host and a third
      party wrote the contract.
    humanURL: https://moodle.gla.ac.uk/
    baseURL: https://moodle.gla.ac.uk/webservice/rest/server.php
    tags: [ Learning Management, LTI, Virtual Learning Environment, Education ]
