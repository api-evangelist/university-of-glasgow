apis:
  - aid: university-of-glasgow:enlighten-oai
    name: Enlighten Publications OAI-PMH
    x-operator: institution
    x-operator-evidence: >-
      eprints.gla.ac.uk is a CNAME to new-rocky.lib.gla.ac.uk (130.209.34.164), inside the
      University of Glasgow's own network and under its own registrable domain. The Identify
      response names the repository "Enlighten Publications" with adminEmail
      research-enlighten@glasgow.ac.uk. The repository software is EPrints, a third party's; the
      deployment, the host, the data and the endpoint are the institution's, which is what the
      operator axis measures.
    description: >-
      OAI-PMH 2.0 metadata harvesting over Enlighten, the University of Glasgow's EPrints
      institutional repository of research outputs — journal articles, conference papers, books,
      book sections and theses. Seven metadata formats are offered: oai_dc, didl, mets, oai_bibl,
      rdf, rioxx (the UK open-access and REF compliance profile) and uketd_dc. Author ORCID
      identifiers are carried inline in the harvestable metadata. Open, unauthenticated, deletedRecord
      persistent, granularity to the second.
    humanURL: https://eprints.gla.ac.uk/information.html
    baseURL: https://eprints.gla.ac.uk/cgi/oai2
    tags: [ Repository, OAI-PMH, Open Access, Publications, EPrints, Metadata ]
    properties:
