  - date: '2026-08-30'
    rating: 3
    summary: >-
      Re-profiled under the university pipeline with the operator axis applied. The finding that
      matters for this cohort is a negative one: nothing in this repository was ever a vendor's
      contract misattributed to the institution — there was no Figshare, Pure, Ex Libris, Symplectic
      or Dataverse spec to remove, and no artifact was deleted in this run. Glasgow's programmable
      footprint is genuinely its own, and it grew: three previously uncatalogued surfaces were found
      and probed live — the Enlighten Theses OAI-PMH endpoint, the undocumented anonymous-read
      Enlighten EPrints REST interface across all three repositories, and the Shibboleth SAML 2.0
      identity provider scoped gla.ac.uk, registered in the UK Access Management Federation with a
      signed MDQ entry. Domain-standard conformance under the education regime was confirmed by
      probe for oai-pmh, shibboleth, saml, datacite, orcid, crossref and lti — seven of the twelve
      named standards, every one with a fetched URL and a status code behind it. Two live surfaces
      run a third party's contract on Glasgow's own hosts and are labelled that way rather than
      credited: the self-hosted Moodle VLE's LTI 1.3 platform endpoints, and the library's
      Innovative Interfaces Sierra API at eleanor.lib.gla.ac.uk. Two are outright vendor tenancies
      recorded as tenant relationships: OCLC WorldCat Discovery at gla.on.worldcat.org and
      Springshare LibGuides at gla.libguides.com. What remains absent is developer experience, not
      surface area: no developer portal, no API key issuance, no changelog, no status page (status.gla.ac.uk
      does not resolve), no support channel, no scopes, no versioning policy and no machine-readable
      error documents. www.gla.ac.uk/llms.txt is a 301 to a law postgraduate page rather than an
      agent manifest, and there is no .well-known/security.txt. No endpoints were fabricated.
